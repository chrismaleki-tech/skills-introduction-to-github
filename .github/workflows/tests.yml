name: Tests

on:
  push:
    paths:
      - "datagolf/**"
      - "wordpress/**"
      - "tests/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "datagolf/**"
      - "wordpress/**"
      - "tests/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pytest openpyxl requests scipy pandas

      - name: Simulator upload invariants
        run: python -m pytest tests -q

      - name: WordPress snippets
        run: php wordpress/snippets/tests/test-matchup-percentages.php
