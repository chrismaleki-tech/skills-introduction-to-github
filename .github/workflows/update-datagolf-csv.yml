name: Update Data Golf CSVs

on:
  workflow_dispatch:
    inputs:
      datasets:
        description: "Comma-separated datasets (players,rankings,schedule,field,predictions,skill_ratings)"
        default: "players,rankings,schedule,field,predictions,skill_ratings"
      tour:
        description: "Tour"
        type: choice
        options: [pga, euro, kft, alt, liv]
        default: pga
      target:
        description: "WordPress site to load into. Scheduled runs always use production."
        type: choice
        options: [production, staging]
        default: production
  schedule:
    # Daily at 10:00 UTC (after Data Golf's overnight model updates).
    - cron: "0 10 * * *"

permissions:
  contents: write

jobs:
  update-csv:
    runs-on: ubuntu-latest
    env:
      WP_URL: ${{ github.event.inputs.target == 'staging' && secrets.WP_STAGING_URL || secrets.WP_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Fetch Data Golf data
        env:
          DATAGOLF_KEY: ${{ secrets.DATAGOLF_KEY }}
        run: |
          python datagolf/update_csv.py \
            --datasets "${{ github.event.inputs.datasets || 'players,rankings,schedule,field,predictions,skill_ratings' }}" \
            --tour "${{ github.event.inputs.tour || 'pga' }}" \
            || echo "some datasets failed (expected off-season for field/predictions)"

      - name: Commit updated CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datagolf/data/*.csv
          if git diff --cached --quiet; then
            echo "No CSV changes to commit."
          else
            git commit -m "chore: update Data Golf CSV snapshots [skip ci]"
            git push
          fi

      - name: Guard staging WordPress target
        if: ${{ github.event.inputs.target == 'staging' }}
        env:
          WP_URL_STAGING: ${{ secrets.WP_STAGING_URL }}
        run: |
          if [ -z "$WP_URL_STAGING" ]; then
            echo "::error::WP_STAGING_URL is not set. Create the SiteGround staging copy, then add the secret (wordpress/STAGING.md)."
            exit 1
          fi

      - name: Load into WordPress
        if: ${{ env.WP_URL != '' }}
        env:
          WP_URL: ${{ github.event.inputs.target == 'staging' && secrets.WP_STAGING_URL || secrets.WP_URL }}
          WP_USERNAME: ${{ github.event.inputs.target == 'staging' && (secrets.WP_STAGING_USERNAME || secrets.WP_USERNAME) || secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ github.event.inputs.target == 'staging' && (secrets.WP_STAGING_APP_PASSWORD || secrets.WP_APP_PASSWORD) || secrets.WP_APP_PASSWORD }}
        run: python datagolf/load_wordpress.py
