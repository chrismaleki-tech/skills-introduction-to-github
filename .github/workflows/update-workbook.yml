name: Weekly StatCaddy Workbook Update

on:
  workflow_dispatch:
    inputs:
      week:
        description: "Week-ending Sunday (YYYY-MM-DD). Leave empty for the most recent Sunday."
        default: ""
  schedule:
    # Tuesday 12:00 UTC: the completed event is archived and the new field's
    # course-fit decompositions are posted by then.
    - cron: "0 12 * * 2"

permissions:
  contents: write

jobs:
  update-workbook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install openpyxl pandas requests
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libreoffice-calc

      - name: Determine week to add
        id: week
        run: |
          WEEK="${{ github.event.inputs.week }}"
          if [ -z "$WEEK" ]; then
            WEEK=$(python3 -c "from datetime import date, timedelta; t = date.today(); print((t - timedelta(days=(t.weekday() + 1) % 7 or 7)) if t.weekday() != 6 else t)")
          fi
          echo "week=$WEEK" >> "$GITHUB_OUTPUT"
          echo "Updating for week ending: $WEEK"

      - name: Update workbook from Data Golf
        env:
          DATAGOLF_KEY: ${{ secrets.DATAGOLF_KEY }}
        run: |
          python3 datagolf/update_workbook.py \
            "datagolf/workbooks/PGA_stat_caddy_latest.xlsx" \
            /tmp/updated.xlsx \
            --archive-date "${{ steps.week.outputs.week }}" \
            --dg-points --course-fit

      - name: Recalculate formulas
        run: |
          mkdir -p /tmp/lo_profile /tmp/recalced
          soffice --headless --norestore -env:UserInstallation=file:///tmp/lo_profile \
            --convert-to xlsx:"Calc MS Excel 2007 XML" --outdir /tmp/recalced /tmp/updated.xlsx
          cp /tmp/recalced/updated.xlsx "datagolf/workbooks/PGA_stat_caddy_latest.xlsx"
          cp /tmp/recalced/updated.xlsx "datagolf/workbooks/PGA_stat_caddy_updated_$(date +%Y-%m-%d).xlsx"

      - name: Commit updated workbook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datagolf/workbooks/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: weekly StatCaddy workbook update (${{ steps.week.outputs.week }}) [skip ci]"
            git push
          fi
